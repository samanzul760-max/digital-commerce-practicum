<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LearnEC · 数字商贸实训工作台</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.39/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
<style>
/* 系统字体栈：用本地字体避免下载5-10MB中文字体文件。
   Windows: Microsoft YaHei / PingFang; Mac: PingFang SC; Android: Noto Sans SC.
   JetBrains Mono 仅用于 .num 数字，用 Consolas/Menlo 等系统等宽字体替代即可。 */
<style>
/* ══════════════════════════════════════════════════════════════
   方案 A 精修：轻蓝工作台 — 大气留白 · 学员 4 页 + 管理 5 页
   此 CSS 块与设计稿一字不差，禁止修改任何规则。
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg: oklch(99% 0.002 240);
  --surface: #fff;
  --fg: oklch(18% 0.012 250);
  --muted: oklch(50% 0.012 250);
  --border: oklch(91% 0.006 250);
  --accent: #147bd1;
  --accent-deep: #0f65ae;
  --accent-soft: oklch(96% 0.022 240);
  --success:#16a34a; --warn:#d97706; --danger:#dc2626;
  --c-orange:#ff9d45; --c-blue:#4d8be5; --c-green:#35ad87; --c-purple:#8671e6;
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono:'Cascadia Code','Fira Code','JetBrains Mono',ui-monospace,Consolas,Menlo,monospace;
  --max: 1180px;
  --r: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-0.025em;font-weight:700}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
a{color:inherit}

/* —— 顶栏 —— */
.top{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:28px;padding:0 40px;
  background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font:700 16px/1 var(--font-display);letter-spacing:-0.02em;flex:none;cursor:pointer}
.logo b{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font:700 14px var(--font-mono);box-shadow:0 2px 6px rgba(20,123,209,.3)}
.tabs{display:flex;height:100%;gap:4px;flex:1}
.tabs button{position:relative;height:100%;padding:0 16px;color:var(--muted);font:500 14px var(--font-body)}
.tabs button:hover{color:var(--fg)}
.tabs button.active{color:var(--fg);font-weight:600}
.tabs button.active:after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.top-right{display:flex;align-items:center;gap:12px;flex:none;position:relative}
.role{display:flex;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.role button{padding:6px 12px;border-radius:8px;font:500 12px var(--font-body);color:var(--muted)}
.role button.on{background:var(--fg);color:#fff;font-weight:600}
.bell{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;color:var(--muted);position:relative}
.bell i{width:16px;height:16px}
.bell.has-unread:after{content:'';position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.notification-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font:600 10px var(--font-mono);padding:1px 5px;border-radius:999px;min-width:18px;text-align:center;line-height:1}
.avatar{width:36px;height:36px;border-radius:50%;background:oklch(30% 0.03 250);color:#fff;display:grid;place-items:center;font:600 13px var(--font-body);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:10px;font:600 14px var(--font-body)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--fg)}
.btn-ghost:hover{border-color:oklch(82% 0.01 250)}
.btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:8px}
.btn-lg{height:48px;padding:0 28px;font-size:15px;border-radius:12px}

/* 下拉菜单 */
.topbar-dropdown{position:absolute;top:52px;right:0;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px rgba(16,24,40,.18);z-index:50;overflow:hidden}
.dropdown-header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.dropdown-header strong{display:block;font-size:14px}
.dropdown-header span{font-size:12px;color:var(--muted)}
.dropdown-list{list-style:none;max-height:280px;overflow-y:auto}
.dropdown-link{display:flex;align-items:center;gap:12px;padding:12px 20px;text-decoration:none;color:inherit;font-size:13px;width:100%;text-align:left;border:0;background:none;cursor:pointer}
.dropdown-link:hover{background:var(--bg)}
.dropdown-icon{width:20px;height:20px;display:grid;place-items:center;color:var(--muted);flex:none}
.dropdown-copy strong{display:block;font-size:13px}
.dropdown-copy span{font-size:11px;color:var(--muted)}
.dropdown-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
.dropdown-button:disabled{opacity:.45;cursor:default}
.role-chip{font:600 10px var(--font-mono);padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep)}
.profile-role-options{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 0;margin:4px 0}
.topbar-backdrop{position:fixed;inset:0;z-index:39}

.shell-s,.shell-a{display:none}
.shell-s.on,.shell-a.on{display:block}
.view{display:none}
.view.active{display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 40px}

/* —— 学员 · 首页 —— */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;padding:80px 0 64px}
.eyebrow{font:600 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:18px 0 20px;font-size:clamp(36px,4.2vw,52px);line-height:1.12;letter-spacing:-0.03em}
.hero .lede{max-width:28em;font-size:17px;line-height:1.7;color:var(--muted)}
.hero-cta{display:flex;gap:14px;margin-top:32px}
.hero-scene{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:5/4;
  box-shadow:0 32px 64px -28px rgba(16,24,40,.28)}
.hero-scene img{width:100%;height:100%;object-fit:cover;display:block}
.hero-badge{position:absolute;left:20px;bottom:20px;padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(16,24,40,.12);
  font:500 13px var(--font-body);display:flex;align-items:center;gap:10px}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}

.resume{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:72px}
.resume-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:24px}
.resume-card h3{font-size:18px;margin:6px 0 8px}
.resume-card p{font-size:14px;color:var(--muted)}
.resume-card .lbl{font:600 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.track{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:14px;max-width:280px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}

.section{padding:0 0 80px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;gap:24px}
.section-head h2{font-size:28px;letter-spacing:-0.02em}
.section-head p{color:var(--muted);font-size:14px;margin-top:6px}
.link{font:500 14px var(--font-body);color:var(--fg);border-bottom:1px solid var(--border);padding-bottom:2px;cursor:pointer}
.link:hover{border-color:var(--fg)}

.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:64px}
.path{padding:28px;border:1px solid var(--border);border-radius:16px;background:var(--surface);transition:border-color .15s,transform .15s;cursor:pointer}
.path:hover{border-color:color-mix(in oklab,var(--accent) 35%,var(--border));transform:translateY(-2px)}
.path .n{font:600 12px var(--font-mono);color:var(--accent);letter-spacing:.08em}
.path h3{font-size:20px;margin:14px 0 8px}
.path span{font-size:14px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.course-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);
  transition:transform .18s,box-shadow .18s}
.course-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(16,24,40,.22)}
.course-banner{height:120px;padding:20px 22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.course-banner:after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:40px;background:rgba(255,255,255,.15);transform:rotate(18deg)}
.course-banner .cat{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.course-banner h3{position:relative;z-index:1;font-size:22px;letter-spacing:-0.02em}
.banner-orange{background:var(--c-orange)}.banner-blue{background:var(--c-blue)}
.banner-green{background:var(--c-green)}.banner-purple{background:var(--c-purple)}
.course-body{padding:20px 22px 22px}
.course-body b{font-size:14px;font-weight:600}
.course-body span{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.course-meta{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.stars{color:#e8a838;letter-spacing:2px;font-size:12px}
.tag{font:500 12px var(--font-body);color:var(--accent-deep);background:var(--accent-soft);padding:4px 10px;border-radius:999px}

.foot{border-top:1px solid var(--border);padding:28px 40px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.foot .num{font-size:11px;letter-spacing:.08em}

/* —— 课程大厅 —— */
.hall{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 64px)}
.filters{padding:40px 28px;border-right:1px solid var(--border);background:var(--surface)}
.filters h4{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 14px}
.filters h4:first-child{margin-top:0}
.filter{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer;color:var(--fg)}
.filter input{accent-color:var(--accent);width:15px;height:15px}
.hall-main{padding:40px 48px}
.hall-tools{display:flex;gap:12px;margin-bottom:28px}
.search{flex:0 1 320px;height:44px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font:14px var(--font-body)}
.search:focus{outline:2px solid color-mix(in oklab,var(--accent) 28%,transparent);border-color:var(--accent)}
.select{height:44px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font:500 14px var(--font-body)}
.hall-main .cards{grid-template-columns:repeat(3,1fr)}
.hall-main .course-banner{height:100px}
.hall-main .course-banner h3{font-size:18px}
.course-card[role="button"]{cursor:pointer}
.course-card:focus-visible,.outline div[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.course-empty{grid-column:1/-1;padding:36px;border:1px dashed var(--border);border-radius:16px;color:var(--muted);text-align:center}
.course-result{margin:-12px 0 20px;color:var(--muted);font-size:13px}

/* —— 学员中心 —— */
.dash{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 64px)}
.side{padding:28px 16px;border-right:1px solid var(--border);background:var(--surface)}
.side button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:10px;color:var(--muted);font:500 14px var(--font-body);text-align:left}
.side button i{width:18px;height:18px}
.side button:hover{background:var(--bg);color:var(--fg)}
.side button.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.dash-main{padding:40px 48px;max-width:980px}
.welcome{padding:36px 40px;border-radius:20px;border:1px solid var(--border);
  background:linear-gradient(165deg,oklch(97% 0.015 240),var(--surface) 60%);
  display:flex;justify-content:space-between;align-items:center;gap:32px;margin-bottom:28px}
.welcome h1{font-size:32px;letter-spacing:-0.025em}
.welcome p{margin-top:10px;font-size:15px;color:var(--muted)}
.welcome p b{color:var(--fg)}
.medals{display:flex;gap:12px}
.medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.08)}
.medal.g{background:radial-gradient(circle at 30% 28%,#ffe9a8,#f0b93c);color:#8a5a00}
.medal.s{background:radial-gradient(circle at 30% 28%,#f0f4f8,#b9c6d2);color:#4a5568}
.medal.b{background:radial-gradient(circle at 30% 28%,#f6d3ae,#cd8d4e);color:#6b3e18}
.medal i{width:22px;height:22px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.stat{padding:24px 28px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font:700 32px/1.15 var(--font-mono);letter-spacing:-0.03em;margin-top:8px}

.two{display:grid;grid-template-columns:1.25fr .85fr;gap:16px}
.paper{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px}
.paper h3{font-size:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.paper h3 .m{font:500 13px var(--font-body);color:var(--muted);font-weight:500}
.prog{display:grid;grid-template-columns:48px 1fr 48px;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--border)}
.prog:first-of-type{border-top:0;padding-top:0}
.thumb{width:48px;height:36px;border-radius:8px}
.prog .name{font-size:14px;font-weight:500}
.prog .track{margin-top:8px;max-width:none}
.prog .pct{text-align:right;font:600 14px var(--font-mono)}
.entry{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--border);gap:16px}
.entry:first-of-type{border-top:0;padding-top:0}
.entry b{font-size:14px;display:block}
.entry span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;padding:4px 10px;border-radius:999px;font:500 12px var(--font-body)}
.pill-ok{background:oklch(96% 0.03 150);color:var(--success)}
.pill-warn{background:oklch(97% 0.035 80);color:var(--warn)}
.pill-info{background:var(--accent-soft);color:var(--accent-deep)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font:600 11px var(--font-mono);color:var(--muted);padding:6px 0}
.cal b{padding:10px 0;border-radius:8px;background:var(--bg);font:500 12px var(--font-mono)}
.cal b.hl{background:var(--accent-soft);color:var(--accent-deep)}
.cal b.td{background:var(--accent);color:#fff}
.remind{margin-top:24px;padding:18px;border-radius:12px;background:var(--bg);border:1px solid var(--border)}
.remind .when{font:600 12px var(--font-mono);color:var(--accent);letter-spacing:.04em}
.remind b{display:block;margin-top:8px;font-size:15px}
.remind p{margin-top:4px;font-size:13px;color:var(--muted)}

/* —— 学习页 —— */
.learn{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;min-height:calc(100vh - 64px)}
.outline{padding:32px 20px;border-right:1px solid var(--border);background:var(--surface)}
.outline h4{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 12px 10px}
.outline h4:first-child{margin-top:0}
.outline div{padding:10px 12px;border-radius:10px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;cursor:pointer}
.outline div i{width:15px;height:15px;flex:none}
.outline div.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.outline div.done{color:var(--success)}
.lesson{padding:48px 56px;max-width:760px}
.lesson h1{font-size:32px;letter-spacing:-0.025em}
.lesson .sub{margin:10px 0 28px;color:var(--muted);font-size:14px}
.video{position:relative;border-radius:16px;overflow:hidden;background:#0c1218;aspect-ratio:16/9}
.video img{width:100%;height:100%;object-fit:cover;opacity:.8;display:block}
.video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;
  background:rgba(255,255,255,.95);color:var(--accent);display:grid;place-items:center;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.video .play:hover{transform:translate(-50%,-50%) scale(1.05)}
.video .play i{width:28px;height:28px;margin-left:3px}
.video.playing .play{opacity:0;transform:translate(-50%,-50%) scale(.92)}
.video.playing:hover .play,.video.playing .play:focus-visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
.video-bar{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font:12px var(--font-mono)}
.video-bar .rail{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.25)}
.video-bar .rail i{display:block;width:32%;height:100%;background:#fff;border-radius:99px}
.video-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 14px;border-radius:999px;
  pointer-events:none;opacity:0;transition:opacity .3s}
.video:hover .video-hint,.video:not(.playing) .play:hover~.video-hint{opacity:1}
.task-box{margin-top:28px;padding:28px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.task-box h3{font-size:17px;margin-bottom:10px}
.task-box p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:20px}
.task-box .actions{display:flex;gap:10px;flex-wrap:wrap}
.learn-status{min-height:22px;margin-top:14px;color:var(--muted);font-size:13px}
.drawer{padding:32px 24px;border-left:1px solid var(--border);background:var(--surface)}
.drawer h3{font-size:16px;margin-bottom:20px}
.teacher{display:flex;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.teacher img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.teacher b{font-size:14px}
.teacher p{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.55}
.comment{padding:16px 0;border-bottom:1px solid var(--border)}
.comment b{font-size:13px}
.comment p{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.6}

/* —— 管理端壳 —— */
.admin{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.admin-side{padding:28px 14px;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:64px;height:calc(100vh - 64px)}
.admin-side .lbl{font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin:0 0 10px}
.admin-side button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:10px;color:var(--muted);font:500 14px var(--font-body);text-align:left;margin-bottom:2px}
.admin-side button i{width:18px;height:18px}
.admin-side button:hover{background:var(--bg);color:var(--fg)}
.admin-side button.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.admin-side button .badge{margin-left:auto;font:600 11px var(--font-mono);background:var(--danger);color:#fff;padding:2px 7px;border-radius:999px}
.admin-main{padding:40px 48px 64px;max-width:1100px}
.admin-main > .page-h{margin-bottom:32px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.admin-main > .page-h h1{font-size:32px;letter-spacing:-0.025em}
.admin-main > .page-h p{margin-top:8px;color:var(--muted);font-size:15px}

.kpi-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kpi{padding:24px 26px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:700 30px/1.15 var(--font-mono);letter-spacing:-0.03em;margin-top:10px}
.kpi .d{font:500 12px var(--font-mono);margin-top:8px;color:var(--success)}
.kpi .d.w{color:var(--warn)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;padding:14px 20px;font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border)}
table.data td{padding:16px 20px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:oklch(99% 0.004 240)}
table.data b{font-weight:600}

.review-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.review-list .item{padding:18px 20px;border-bottom:1px solid var(--border);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px}
.review-list .item:hover,.review-list .item.on{background:var(--accent-soft)}
.review-list .item:last-child{border-bottom:0}
.review-pane{position:sticky;top:88px}
.score-in{width:100%;height:48px;border:1px solid var(--border);border-radius:10px;padding:0 14px;font:600 18px var(--font-mono);margin:12px 0}
.ta{width:100%;min-height:100px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font:14px var(--font-body);resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.tags button{padding:6px 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.tags button:hover{border-color:var(--accent);color:var(--accent)}

.chart-bars{display:flex;align-items:flex-end;gap:12px;height:160px;padding-top:8px}
.chart-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart-bars .col i{width:100%;border-radius:6px 6px 0 0;background:var(--accent);min-height:4px}
.chart-bars .col span{font:500 11px var(--font-mono);color:var(--muted)}

/* 加载态 */
.loading-state{padding:80px 40px;text-align:center;color:var(--muted);font-size:15px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--fg);color:#fff;padding:12px 28px;border-radius:12px;
  font:500 14px var(--font-body);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.toast-fade-enter-active,.toast-fade-leave-active{transition:all .25s}
.toast-fade-enter-from,.toast-fade-leave-to{opacity:0;transform:translateX(-50%) translateY(12px)}
/* Modal */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.4);
  backdrop-filter:blur(4px);display:grid;place-items:center}
.modal-card{background:var(--surface);border-radius:20px;padding:32px 36px;
  width:480px;max-width:90vw;box-shadow:0 32px 80px rgba(16,24,40,.35)}
.modal-fade-enter-active,.modal-fade-leave-active{transition:all .2s}
.modal-fade-enter-from,.modal-fade-leave-to{opacity:0}

/* —— 登录页 —— */
.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 440px;align-items:center}
.login-hero{padding:80px 64px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.login-hero h1{font-size:48px;letter-spacing:-0.03em;line-height:1.1}
.login-hero p{font-size:17px;color:var(--muted);max-width:460px;line-height:1.7}
.login-brand{display:flex;align-items:center;gap:12px;font:700 20px/1 var(--font-display);margin-bottom:12px}
.login-brand b{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 16px var(--font-mono)}
.login-card{padding:48px 40px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 60px rgba(16,24,40,.1);margin:40px}
.login-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:24px}
.login-tabs button{flex:1;padding:10px;border-radius:9px;font:500 14px var(--font-body);color:var(--muted);text-align:center}
.login-tabs button.active{background:var(--fg);color:#fff;font-weight:600}
.login-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.login-field{display:block;font-size:13px;color:var(--muted);margin-bottom:16px}
.login-field input{display:block;width:100%;margin-top:6px;height:46px;padding:0 14px;border:1px solid var(--border);border-radius:10px;font:14px var(--font-body);background:var(--surface)}
.login-field input:focus{outline:2px solid color-mix(in oklab,var(--accent) 28%,transparent);border-color:var(--accent)}
.login-roles{display:flex;gap:8px;margin-bottom:16px}
.login-roles button{padding:6px 14px;border:1px solid var(--border);border-radius:8px;font:13px var(--font-body);color:var(--muted)}
.login-roles button.on{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent);font-weight:600}
.login-btn{width:100%;height:48px;background:var(--accent);color:#fff;border:0;border-radius:12px;font:600 15px var(--font-body);cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.login-btn:hover{background:var(--accent-deep)}
.login-btn:disabled{opacity:.55;cursor:not-allowed}
.login-err{color:var(--danger);font-size:13px;margin:12px 0;padding:10px 14px;background:oklch(97% 0.04 30);border-radius:8px}
.login-note{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
@media(max-width:860px){.login-page{grid-template-columns:1fr}.login-hero{padding:48px 32px 24px}.login-hero h1{font-size:36px}.login-card{margin:24px;padding:32px 24px}}

/* —— 教程中心 —— */
.tutorial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.tutorial-card{padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.tutorial-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,24,40,.12);border-color:color-mix(in oklab,var(--accent) 30%,var(--border))}
.tutorial-card .tut-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tutorial-card .tut-top span{font:600 11px var(--font-mono);letter-spacing:.08em;color:var(--muted)}
.tutorial-card .tut-top strong{font:600 12px var(--font-body);color:var(--accent)}
.tutorial-card h3{font-size:16px;margin-bottom:6px}
.tutorial-card .tut-summary{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.tutorial-card .tut-meta{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.tutorial-card .tut-deliverable{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.tut-detail-card{padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.tut-detail-card h2{font-size:24px}
.tut-detail-card .rubric-row{display:grid;grid-template-columns:1fr 80px;gap:8px;padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.tut-detail-card .rubric-row:first-of-type{border-top:0}

@media(max-width:1100px){
  .hero,.resume,.two,.review-grid{grid-template-columns:1fr}
  .paths,.cards,.kpi-4,.stat-row{grid-template-columns:1fr 1fr}
  .learn{grid-template-columns:200px 1fr}
  .drawer{display:none}
  .top{padding:0 20px;gap:16px}
  .wrap,.hall-main,.dash-main,.admin-main,.lesson{padding-left:24px;padding-right:24px}
}
@media(max-width:720px){
  .tabs{overflow:auto}
  .role span{display:none}
  .hero{padding:48px 0 40px;gap:32px}
  .hero h1{font-size:32px}
  .hall,.dash,.admin,.learn{grid-template-columns:1fr}
  .filters,.side,.admin-side,.outline{display:none}
  .paths,.cards,.kpi-4,.stat-row{grid-template-columns:1fr}
  .resume-card{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div id="app">
  <!-- ========== 登录页 ========== -->
  <div v-if="!loggedIn" class="login-page">
    <div class="login-hero">
      <div class="login-brand"><b>L</b><span>LearnEC</span></div>
      <h1>数字商贸实训工作台</h1>
      <p>从课程学习到真实经营分析，让每一次实训都沉淀为可复用的电商能力。</p>
    </div>
    <div class="login-card">
      <div class="login-tabs"><button :class="{active:loginMode==='demo'}" @click="loginMode='demo';loginError=''">演示进入</button><button :class="{active:loginMode==='login'}" @click="loginMode='login';loginError=''">账号登录</button></div>
      <template v-if="loginMode==='demo'">
        <p class="login-desc">点击下方按钮直接进入学员实训空间，无需输入账号密码。</p>
        <p v-if="loginError" class="login-err" role="alert">{{loginError}}</p>
        <button class="login-btn" :disabled="loginLoading" @click="doDemoEntry">{{loginLoading?'正在开通...':'开通并直接进入'}}</button>
        <p class="login-note">仅在已启用的本地演示环境中可用。</p>
      </template>
      <template v-if="loginMode==='login'">
        <label class="login-field">账号<input v-model="loginId" placeholder="请输入账号" autocomplete="username" @keyup.enter="doLogin"></label>
        <label class="login-field">密码<input v-model="loginPw" type="password" placeholder="请输入密码" autocomplete="current-password" @keyup.enter="doLogin"></label>
        <div class="login-roles"><button :class="{on:authRole==='STUDENT'}" @click="authRole='STUDENT'" type="button">学员</button><button :class="{on:authRole==='OWNER'}" @click="authRole='OWNER'" type="button">管理</button></div>
        <p v-if="loginError" class="login-err" role="alert">{{loginError}}</p>
        <button class="login-btn" :disabled="loginLoading" @click="doLogin">{{loginLoading?'登录中...':'登录'}}</button>
      </template>
    </div>
  </div>

  <!-- ========== 主界面（登录后） ========== -->
  <template v-else>
  <!-- ========== 顶栏 ========== -->
  <header class="top" data-od-id="topnav">
    <div class="logo" @click="studentPage='home';adminPage='a-dash'"><b>L</b>LearnEC</div>
    <nav v-if="!isAdmin" class="tabs" data-od-id="student-tabs">
      <button :class="{active:studentPage==='home'}" @click="studentPage='home'">首页</button>
      <button :class="{active:studentPage==='courses'}" @click="studentPage='courses'">课程大厅</button>
      <button :class="{active:studentPage==='center'}" @click="studentPage='center'">学员中心</button>
      <button :class="{active:studentPage==='learn'}" @click="studentPage='learn'">实操学习</button>
    </nav>
    <nav v-else class="tabs" data-od-id="admin-tabs">
      <button :class="{active:adminPage==='a-dash'}" @click="adminPage='a-dash'">管理控制台</button>
    </nav>
    <div class="top-right">
      <div class="role" data-od-id="role-switch">
        <button :class="{on:!isAdmin}" @click="switchRole(false)">学员</button>
        <button :class="{on:isAdmin}" @click="switchRole(true)">管理</button>
      </div>
      <button class="bell" :class="{'has-unread':unreadCount>0}" aria-label="通知" @click="showNotif=!showNotif;showProfile=false">
        <i data-lucide="bell"></i>
        <span v-if="unreadCount" class="notification-badge">{{ unreadCount>99?'99+':unreadCount }}</span>
      </button>
      <section v-if="showNotif" class="topbar-dropdown" style="width:340px;right:120px">
        <div class="dropdown-header"><div><strong>消息通知</strong><span>查看近期消息和任务提醒</span></div></div>
        <ul v-if="notifications.length" class="dropdown-list">
          <li v-for="n in notifications.slice(0,5)" :key="n.id">
            <a href="#" class="dropdown-link" @click.prevent="showNotif=false"><span class="dropdown-icon"><i data-lucide="bell"></i></span><span class="dropdown-copy"><strong>{{n.title}}</strong><span>{{n.time}}</span></span></a>
          </li>
        </ul>
        <p v-else class="dropdown-empty">暂无通知</p>
      </section>
      <div class="avatar" @click="showProfile=!showProfile;showNotif=false">{{ userInitial }}</div>
      <section v-if="showProfile" class="topbar-dropdown">
        <div class="dropdown-header"><div><strong>{{ displayName }}</strong><span>LearnEC · 数字商贸实训</span></div><span class="role-chip">{{ isAdmin?'管理':'学员' }}</span></div>
        <div class="dropdown-list">
          <button class="dropdown-link" @click="openSettings"><span class="dropdown-icon"><i data-lucide="user"></i></span><span class="dropdown-copy"><strong>账号设置</strong><span>查看当前账户信息</span></span></button>
          <button class="dropdown-link" @click="openSettings"><span class="dropdown-icon"><i data-lucide="settings"></i></span><span class="dropdown-copy"><strong>偏好设置</strong><span>语言、通知与界面选项</span></span></button>
          <div class="profile-role-options">
            <button class="dropdown-link dropdown-button" :class="{active:!isAdmin}" :disabled="!isAdmin" @click="switchRole(false)"><span class="dropdown-icon"><i data-lucide="refresh-cw"></i></span><span class="dropdown-copy"><strong>学员视角</strong><span>切换到学员身份</span></span></button>
            <button class="dropdown-link dropdown-button" :class="{active:isAdmin}" :disabled="isAdmin" @click="switchRole(true)"><span class="dropdown-icon"><i data-lucide="refresh-cw"></i></span><span class="dropdown-copy"><strong>管理视角</strong><span>切换到管理身份</span></span></button>
          </div>
          <button class="dropdown-link" @click="doLogout"><span class="dropdown-icon"><i data-lucide="log-out"></i></span><span class="dropdown-copy"><strong>退出登录</strong><span>安全退出当前账户</span></span></button>
        </div>
      </section>
      <button class="btn btn-primary btn-sm" @click="handleCTA">{{ ctaLabel }}</button>
    </div>
  </header>
  <div v-if="showNotif||showProfile" class="topbar-backdrop" @click="showNotif=false;showProfile=false"></div>

  <!-- Toast -->
  <transition name="toast-fade">
    <div v-if="toast" class="toast">{{ toast }}</div>
  </transition>

  <!-- 新建计划弹窗 -->
  <transition name="modal-fade">
    <div v-if="showPlanForm" class="modal-backdrop" @click.self="showPlanForm=false">
      <div class="modal-card">
        <h2>新建实训计划</h2>
        <label style="display:block;margin-top:20px;font-size:13px;color:var(--muted)">计划名称</label>
        <input v-model="planForm.title" class="search" style="width:100%;margin-top:6px" placeholder="例如：跨境电商入门实战" />
        <label style="display:block;margin-top:16px;font-size:13px;color:var(--muted)">分类</label>
        <select v-model="planForm.category" class="select" style="width:100%;margin-top:6px">
          <option>店铺增长</option><option>直播运营</option><option>数据分析</option>
        </select>
        <label style="display:block;margin-top:16px;font-size:13px;color:var(--muted)">简介</label>
        <input v-model="planForm.desc" class="search" style="width:100%;margin-top:6px" placeholder="简短描述" />
        <div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end">
          <button class="btn btn-ghost" @click="showPlanForm=false">取消</button>
          <button class="btn btn-primary" @click="savePlan">创建</button>
        </div>
      </div>
    </div>
  </transition>

  <!-- ========== 加载态 ========== -->
  <div v-if="loading" class="loading-state"><div class="spinner"></div><p>正在加载工作台数据…</p></div>

  <!-- ==================== 学员端 ==================== -->
  <div v-else-if="!isAdmin" class="shell-s on">

    <!-- 首页 -->
    <section v-show="studentPage==='home'" class="view active" data-od-id="page-home">
      <div class="wrap">
        <div class="hero">
          <div>
            <div class="eyebrow">Digital Commerce Practicum</div>
            <h1>用真实店铺任务<br>学会电商经营</h1>
            <p class="lede">课程、模拟店铺与老师批阅连成一条线。少一点界面噪音，多一点完成感。</p>
            <div class="hero-cta">
              <button class="btn btn-primary btn-lg" @click="studentPage='learn'"><i data-lucide="play" style="width:16px;height:16px"></i>继续学习</button>
              <button class="btn btn-ghost btn-lg" @click="studentPage='courses'">浏览课程</button>
            </div>
          </div>
          <div class="hero-scene">
            <img src="assets/hero-classroom.jpg" alt="实训课堂" />
            <div class="hero-badge"><span class="dot"></span>本周实训 · <b style="margin-left:4px">{{ topPlanTitle }}</b></div>
          </div>
        </div>
        <div class="resume" data-od-id="resume">
          <div class="resume-card">
            <div>
              <div class="lbl">继续上次</div>
              <h3>{{ topPlanTitle }}</h3>
              <p>进度 {{ topPlanProgress }}%</p>
              <div class="track"><i :style="{width:topPlanProgress+'%'}"></i></div>
            </div>
            <button class="btn btn-primary" @click="studentPage='learn'">接着学</button>
          </div>
          <div class="resume-card">
            <div><div class="lbl">待办</div><h3>{{ pendingCount }} 个任务待处理</h3><p>{{ pendingLabel }}</p></div>
            <button class="btn btn-ghost" @click="studentPage='center'">去处理</button>
          </div>
        </div>
        <div class="section">
          <div class="section-head"><div><h2>学习路径</h2><p>三条清晰进阶线，而不是一堆散课。</p></div></div>
          <div class="paths" data-od-id="paths">
            <div class="path" @click="studentPage='courses'"><div class="n">01</div><h3>开店起航</h3><span>选品 · 上架 · 详情页</span></div>
            <div class="path" @click="studentPage='courses'"><div class="n">02</div><h3>内容与直播</h3><span>脚本 · 场控 · 复盘</span></div>
            <div class="path" @click="studentPage='courses'"><div class="n">03</div><h3>数据增长</h3><span>读数 · 投放 · 转化</span></div>
          </div>
          <div class="section-head"><div><h2>热门课程</h2><p>从真实业务任务开始。</p></div><span class="link" @click="studentPage='courses'">全部课程 →</span></div>
          <div class="cards">
            <article v-for="(c,i) in visiblePlans.slice(0,3)" :key="c.id" class="course-card" role="button" tabindex="0" @click="openPlan(c)" @keydown.enter.space.prevent="openPlan(c)">
              <div :class="['course-banner',bannerColors[i%4]]"><span class="cat">{{c.category||'实训'}}</span><h3>{{c.title}}</h3></div>
              <div class="course-body"><b>{{c.category||'实训课程'}}</b><span>{{c.desc||'暂无简介'}}</span><div class="course-meta"><span class="stars">★★★★★</span><span class="tag">{{c.tag||'实训计划'}}</span></div></div>
            </article>
            <p v-if="!visiblePlans.length" class="course-empty">暂无已发布的课程，等待教学管理员发布。</p>
          </div>
        </div>
      </div>
      <footer class="foot"><span>LearnEC · 数字商贸实训工作台</span><span class="num">STUDENT WORKSPACE</span></footer>
    </section>

    <!-- 课程大厅 -->
    <section v-show="studentPage==='courses'" class="view active" data-od-id="page-courses">
      <div class="hall">
        <aside class="filters" data-od-id="filters">
          <h4>分类</h4>
          <label v-for="o in filterOptions.categories" class="filter"><input type="checkbox" :value="o" v-model="filters.categories">{{o}}</label>
          <h4>难度</h4>
          <label v-for="o in filterOptions.levels" class="filter"><input type="checkbox" :value="o" v-model="filters.levels">{{o}}</label>
          <h4>类型</h4>
          <label v-for="o in filterOptions.types" class="filter"><input type="checkbox" :value="o" v-model="filters.types">{{o}}</label>
        </aside>
        <main class="hall-main">
          <div class="section-head" style="margin-bottom:24px"><div><h2>课程大厅</h2><p>共 {{ visiblePlans.length }} 门实训课</p></div></div>
          <div class="hall-tools">
            <input class="search" v-model="searchQuery" placeholder="搜索课程或技能" />
            <select class="select" v-model="sortBy"><option value="recommended">推荐排序</option><option value="name">课程名称</option></select>
          </div>
          <p class="course-result">显示 {{ filteredPlans.length }} 门课程</p>
          <div class="cards">

<script>
const { createApp, ref, computed, watch, nextTick, onMounted } = Vue

/* ══════════════════════════════════════════════════════════════
   API 层 — 尝试调用后端 API，失败时静默降级到种子数据
   ══════════════════════════════════════════════════════════════ */
const API = {
  async fetch(path) {
    try { const r = await fetch(path,{credentials:'same-origin'}); if(!r.ok) throw r; return await r.json() }
    catch { return null }
  },
  async getPlans() {
    const d = await this.fetch('/api/practicum/plans?status=PUBLISHED&pageSize=50')
    if (d?.items?.length) return d.items.map(p=>({id:p.id,title:p.title,category:catLabel(p.title+(p.description||'')),desc:p.description||'',tag:'实训计划',status:p.status}))
    return null
  },
  async getProgress() { return await this.fetch('/api/practicum/progress?role=STUDENT') },
  async getTasks() {
    const d = await this.fetch('/api/practicum/student/tasks')
    if (d?.items) return d.items
    return null
  },
  async getNotifications() {
    const d = await this.fetch('/api/practicum/notifications')
    if (d?.items) return d
    return null
  },
  async getSubmissions() {
    const d = await this.fetch('/api/practicum/submissions?status=SUBMITTED&pageSize=50')
    if (d?.items) return d.items
    return null
  },
  async getSession() {
    const d = await this.fetch('/api/auth/session')
    return d?.user || null
  },
  async getProducts() {
    const d = await this.fetch('/api/practicum/shop/products')
    return d?.items || null
  },
  async getTemplates() {
    const d = await this.fetch('/api/practicum/templates')
    return d?.items || null
  },
  async getCompetitions() {
    const d = await this.fetch('/api/practicum/competitions')
    return d?.items || null
  },
  async getMembers() {
    const d = await this.fetch('/api/practicum/members?pageSize=50')
    return d?.items || null
  },
  async getAnalytics() {
    const d = await this.fetch('/api/practicum/analytics/members')
    return d || null
  },
  async getCases() {
    try { const m = await import('/data/practicum/commerce-case-seed.ts'); return m.commerceCases || [] }
    catch { return null }
  },
  async getAchievements() {
    try { const m = await import('/data/practicum/achievement-catalog.ts'); return m }
    catch { return null }
  },
  async getTemplates() {
    const d = await this.fetch('/api/practicum/templates')
    return d?.items || null
  },
  async getCompetitions() {
    const d = await this.fetch('/api/practicum/competitions')
    return d?.items || null
  },
  async getAnalyticsOverview() {
    const d = await this.fetch('/api/practicum/analytics/overview')
    return d || null
  },
  async getClasses() {
    const d = await this.fetch('/api/practicum/classes')
    return d?.items || null
  },
  async getFreightTemplates() {
    const d = await this.fetch('/api/practicum/shop/freight-templates')
    return d?.items || null
  },
  async getInvites() {
    const d = await this.fetch('/api/practicum/members/invites')
    return d?.items || null
  },
  async loginDemo() {
    const d = await this.fetch('/api/auth/demo-entry')
    return d || null
  },
  async login(identifier, password) {
    try { const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier,password}),credentials:'same-origin'}); if(!r.ok) throw r; return await r.json() }
    catch(e){ throw e }
  },
  async sendNotification(title, message, route) {
    try { const r = await fetch('/api/practicum/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,message,targetRoute:route}),credentials:'same-origin'}); if(!r.ok) throw r; return await r.json() }
    catch(e){ throw e }
  },
  async createInvite(invitee, groupName) {
    try { const r = await fetch('/api/practicum/members/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invitee,groupName}),credentials:'same-origin'}); if(!r.ok) throw r; return await r.json() }
    catch(e){ throw e }
  },
  async revokeInvite(id) {
    try { await fetch(`/api/practicum/members/invites/${id}/revoke`,{method:'POST',credentials:'same-origin'}); return true }
    catch { return false }
  },
  async saveRoomSettings(desc, mediaUrl) {
    try { const r = await fetch('/api/practicum/room-settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:desc,mediaUrl}),credentials:'same-origin'}); if(!r.ok) throw r; return await r.json() }
    catch(e){ throw e }
  },
  async getRoomSettings() {
    return await this.fetch('/api/practicum/room-settings')
  },
  async createCompetition(data) {
    try { const r = await fetch('/api/practicum/competitions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'}); if(!r.ok) throw r; return await r.json() }
    catch(e){ throw e }
  }
}

    }
    // 通知发送
    async function sendNotification(){ if(!composeTitle.value.trim()){toastMsg('请输入通知标题');return};composeResult.value='发送中...';try{await API.sendNotification(composeTitle.value,composeMessage.value,composeRoute.value);composeResult.value='通知已发送！';composeTitle.value='';composeMessage.value='';setTimeout(()=>composeResult.value='',3000)}catch{composeResult.value='发送失败，请重试。'}}
    // 成员邀请
    async function createInvite(){ if(!inviteeId.value.trim()){toastMsg('请输入受邀用户 ID');return};inviteResult.value='创建中...';try{await API.createInvite(inviteeId.value,inviteGroup.value);inviteResult.value='邀请已创建！';inviteeId.value='';inviteGroup.value='';loadInvites()}catch{inviteResult.value='创建失败。'}finally{setTimeout(()=>inviteResult.value='',3000)}}
    async function doRevokeInvite(id){ await API.revokeInvite(id);loadInvites();toastMsg('邀请已撤销')}
    // 实训室设置
    async function saveRoom(){ roomSaveResult.value='保存中...';try{await API.saveRoomSettings(roomDesc.value,roomMedia.value);roomSaveResult.value='已保存';setTimeout(()=>roomSaveResult.value='',3000)}catch{roomSaveResult.value='保存失败。'}}
    // 竞赛
    async function createCompetition(){ if(!compForm.value.title.trim()){toastMsg('请输入比赛名称');return};try{await API.createCompetition(compForm.value);showCompForm.value=false;compForm.value={title:'',description:'',roomId:''};loadCompetitions();toastMsg('比赛草稿已创建')}catch{toastMsg('创建失败')}}

    /* ── 数据加载 ── */
    const DATA_READY = ref(false)
    async function loadData() {
      // 最多 500ms 显示加载态，然后展示种子数据 + 后台静默刷新 API
      setTimeout(()=>{ loading.value = false }, 500)
      try {
        const [plans, progress, tasks, notifs, subs, products, members, cases, achievements, session] =
          await Promise.allSettled([
            API.getPlans(), API.getProgress(), API.getTasks(), API.getNotifications(),
            API.getSubmissions(), API.getProducts(), API.getMembers(),
            API.getCases(), API.getAchievements(), API.getSession()
          ])
        if (plans.status==='fulfilled' && plans.value) allPlans.value = plans.value
        if (tasks.status==='fulfilled' && tasks.value) {
          taskItems.value = tasks.value.slice(0,8).map((t)=>({
            id:t.id,title:t.activity?.title||'任务',desc:t.source?.title||'',
            cls:t.status==='SUBMITTED'?'pill-warn':t.status==='RETURNED'?'pill-info':'pill-ok',
            status:t.status==='SUBMITTED'?'待批':t.status==='RETURNED'?'修改':t.status==='GRADED'?'完成':'进行'
          }))
        }
        if (notifs.status==='fulfilled' && notifs.value) {
          notifications.value = notifs.value.items.slice(0,5).map((n)=>({id:n.id,title:n.title,time:fmtTime(n.createdAt)}))
          unreadCount.value = notifs.value.unread || notifs.value.items.filter((n)=>!n.read).length
        }
        if (subs.status==='fulfilled' && subs.value) {
          reviewQueue.value = subs.value.map((s)=>({student:s.studentLabel||'学员',task:s.activityTitle||'任务',course:s.planTitle||'',time:fmtTime(s.submittedAt),status:s.status||'SUBMITTED'}))
        }
        if (products.status==='fulfilled' && products.value) shopProducts.value = products.value
        if (members.status==='fulfilled' && members.value) {
          SEED.members = members.value.map((m)=>({id:m.id,name:m.label,'class':m.group||'未分组',progress:Math.floor(30+Math.random()*70),pending:Math.floor(Math.random()*3),active:'今天',status:'正常'}))
        }
        if (cases.status==='fulfilled' && cases.value) commerceCases.value = cases.value
        if (achievements.status==='fulfilled' && achievements.value) {
          allBadges.value = achievements.value.achievementBadges?.map((b)=>({...b,unlocked:b.state==='unlocked',progress:b.progress||0,target:b.target||1})) || SEED.badges
        }
        if (session.status==='fulfilled' && session.value) displayName.value = session.value.displayName || '张怡'
      } catch {} finally { loading.value = false; DATA_READY.value = true }
    }

    function fmtTime(v){try{return new Intl.DateTimeFormat('zh-CN',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}catch{return v||''}}

    /* ── 扩展数据加载 ── */
    async function loadTemplates(){ const d = await API.getTemplates(); if(d) templates.value = d }
    async function loadCompetitions(){ const d = await API.getCompetitions(); if(d) competitions.value = d }
    async function loadInvites(){ const d = await API.getInvites(); if(d) invites.value = d }
    async function loadFreightTemplates(){ const d = await API.getFreightTemplates(); if(d) freightTemplates.value = d }
    async function loadDataCenter(){ const d = await API.getAnalyticsOverview(); if(d) dataCenterData.value = d }
    async function loadRoomSettings(){ const d = await API.getRoomSettings(); if(d){roomSettings.value=d;roomDesc.value=d.description||'';roomMedia.value=d.mediaUrl||''}}
    async function loadExtended(){ Promise.allSettled([loadTemplates(),loadCompetitions(),loadInvites(),loadFreightTemplates(),loadDataCenter(),loadRoomSettings()]) }

    /* ── 图标刷新 ── */
    function refreshIcons(){nextTick(()=>{if(window.lucide)lucide.createIcons()})}
    watch([studentPage,adminPage,centerTab,showNotif,showProfile,learnMode,currentLesson,videoPlaying,isAdmin,loading,loggedIn],refreshIcons)
    onMounted(async()=>{
      // 尝试自动获取会话
      const s = await API.getSession()
      if(s){ loggedIn.value=true; displayName.value=s.displayName||'张怡'; if(s.role) setRole(s.role) }
      if(loggedIn.value){ await loadData(); loadExtended() }
      else { loading.value = false }
      refreshIcons()
    })

    return {
      loading,isAdmin,studentPage,adminPage,centerTab,showNotif,showProfile,
      displayName,userInitial,allPlans,visiblePlans,topPlanTitle,topPlanProgress,
      pendingCount,pendingLabel,ctaLabel,searchQuery,sortBy,filters,filterOptions,
      filteredPlans,lessonOutline,currentLesson,videoPlaying,taskSubmitted,learnStatus,
      learnMode,selectedCase,caseAnswer,caseResult,commerceCases,
      notifications,unreadCount,progressItems,todoItems,taskItems,
      shopProducts,allBadges,unlockedBadges,scoreHeights,weekDays,bannerColors,progressColors,
      calendarTitle,calDays,reviewQueue,selectedReview,reviewScore,reviewFeedback,reviewResult,
      memberSearch,filteredMembers,adminStats,adminPlanProgress,
      portfolioCount,statsAvgScore,statsSubmitRate,statsReworkRate,
      switchRole,setRole,handleCTA,doLogout,doLogin,doDemoEntry,openPlan,selectLesson,submitTask,submitCase,
      selectReview,doGrade,doReturn,showPlanForm,planForm,toast,newPlan,savePlan,
      managePlan,exportMembers,openSettings,addShopProduct,toggleProductStatus,removeProduct,
      addFreightTemplate,removeFreight,sendNotification,createInvite,doRevokeInvite,
      saveRoom,createCompetition,
      // login
      loggedIn,loginMode,loginLoading,loginError,authRole,loginId,loginPw,
      // tutorials
      TUTORIALS,selectedTutorial,
      // admin extended
      templates,competitions,adminClasses,freightTemplates,invites,dataCenterData,roomSettings,
      showCompForm,compForm,
      // notifications compose
      composeTitle,composeMessage,composeRoute,composeResult,
      // member invites
      inviteeId,inviteGroup,inviteResult,
      // room settings
      roomDesc,roomMedia,roomSaveResult
    }
  }
}).mount('#app')
</script>
</body>
</html>
